<!DOCTYPE html>
<html lang="es">
<head>

  <!-- =======================================================
       CONFIGURACIÓN GENERAL
       ======================================================= -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>PREMIOS ECUABET</title>

  <meta
    name="description"
    content="PREMIOS ECUABET"
  >


  <!-- =======================================================
       OPEN GRAPH
       VISTA PREVIA PARA WHATSAPP / FACEBOOK / TELEGRAM
       ======================================================= -->

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:site_name"
    content="PREMIOS ECUABET"
  >

  <meta
    property="og:title"
    content="PREMIOS ECUABET"
  >

  <meta
    property="og:description"
    content="Ingresa para conocer más información."
  >

  <meta
    property="og:url"
    content="https://1iliil.github.io/PREMIOS-ECUABET/"
  >

  <!-- IMAGEN PRINCIPAL PARA WHATSAPP -->

  <meta
    property="og:image"
    content="https://1iliil.github.io/PREMIOS-ECUABET/Logo.png"
  >

  <meta
    property="og:image:secure_url"
    content="https://1iliil.github.io/PREMIOS-ECUABET/Logo.png"
  >

  <meta
    property="og:image:type"
    content="image/png"
  >

  <meta
    property="og:image:alt"
    content="PREMIOS ECUABET"
  >


  <!-- =======================================================
       X / TWITTER
       ======================================================= -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="PREMIOS ECUABET"
  >

  <meta
    name="twitter:description"
    content="Ingresa para conocer más información."
  >

  <meta
    name="twitter:image"
    content="https://1iliil.github.io/PREMIOS-ECUABET/Logo.png"
  >


  <!-- =======================================================
       FAVICON
       ======================================================= -->

  <link
    rel="icon"
    type="image/png"
    href="./Logo.png"
  >


  <!-- =======================================================
       CSS
       ======================================================= -->

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html {
      width: 100%;
      height: 100%;
    }


    body {

      width: 100%;
      min-height: 100vh;

      display: flex;

      justify-content: center;
      align-items: center;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #07152c 0%,
          #0b2246 50%,
          #12376e 100%
        );

      color: #ffffff;

    }


    /* CONTENEDOR PRINCIPAL */

    .container {

      width: 100%;

      max-width: 700px;

      padding: 40px 20px;

      text-align: center;

    }


    /* TARJETA */

    .card {

      width: 100%;

      padding: 40px 30px;

      border-radius: 24px;

      background:
        rgba(
          255,
          255,
          255,
          0.08
        );

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.15
        );

      box-shadow:
        0 20px 60px
        rgba(
          0,
          0,
          0,
          0.35
        );

      backdrop-filter:
        blur(10px);

    }


    /* LOGO */

    .logo {

      display: block;

      width: 100%;

      max-width: 450px;

      height: auto;

      margin:
        0 auto
        30px auto;

      object-fit: contain;

    }


    /* TÍTULO */

    h1 {

      margin-bottom: 15px;

      font-size: 34px;

      font-weight: 700;

      letter-spacing: 1px;

    }


    /* DESCRIPCIÓN */

    .description {

      margin-bottom: 30px;

      font-size: 17px;

      line-height: 1.6;

      opacity: 0.9;

    }


    /* BOTÓN */

    .button {

      display: inline-block;

      padding:
        15px 32px;

      border-radius: 30px;

      background: #ffffff;

      color: #07152c;

      text-decoration: none;

      font-size: 16px;

      font-weight: bold;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

    }


    .button:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 10px 25px
        rgba(
          0,
          0,
          0,
          0.25
        );

    }


    /* PIE */

    .footer {

      margin-top: 30px;

      font-size: 13px;

      opacity: 0.65;

    }


    /* =======================================================
       RESPONSIVE
       ======================================================= */

    @media
    (max-width: 600px) {

      .container {

        padding:
          20px 15px;

      }


      .card {

        padding:
          30px 20px;

        border-radius:
          18px;

      }


      .logo {

        max-width:
          320px;

      }


      h1 {

        font-size:
          27px;

      }


      .description {

        font-size:
          16px;

      }


      .button {

        width:
          100%;

        max-width:
          300px;

      }

    }

  </style>

</head>


<body>

  <main class="container">

    <section class="card">


      <!-- ==============================
           LOGO
           ============================== -->

      <img
        src="./Logo.png"
        alt="PREMIOS ECUABET"
        class="logo"
      >


      <!-- ==============================
           TÍTULO
           ============================== -->

      <h1>
        PREMIOS ECUABET
      </h1>


      <!-- ==============================
           TEXTO
           ============================== -->

      <p class="description">
        Ingresa para conocer más información.
      </p>


      <!-- ==============================
           BOTÓN
           ============================== -->

      <a
        href="#"
        class="button"
        onclick="return false;"
      >
        INGRESAR
      </a>


      <!-- ==============================
           PIE
           ============================== -->

      <div class="footer">
        PREMIOS ECUABET
      </div>


    </section>

  </main>


</body>
</html>

        content="image/png">

        content="PREMIOS ECUABET">


  <!-- ===================================================== -->

        content="width=device-width, initial-scale=1.0">

  <title>PREMIOS ECUABET</title>

        content="Ingresa y conoce más información.">

        content="summary_large_image">

        content="https://1iliil.github.io/PREMIOS-ECUABET/Logo.png">


  <!-- ===================================================== -->

  <!-- ===================================================== -->

  <link rel="icon"
        type="image/png"
        href="https://1iliil.github.io/PREMIOS-ECUABET/Logo.png">


  <!-- ===================================================== -->
  <!-- ESTILOS                                               -->
  <!-- ===================================================== -->

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #061326 0%,
          #0a2348 50%,
          #123b75 100%
        );

      color: #ffffff;

    }


    /* =============================== */
    /* CONTENEDOR                      */
    /* =============================== */

    .contenedor {

      width: 100%;
      max-width: 700px;

      padding: 25px;

      text-align: center;

    }


    /* =============================== */
    /* TARJETA                         */
    /* =============================== */

    .tarjeta {

      width: 100%;

      padding: 40px 25px;

      border-radius: 25px;

      background:
        rgba(
          255,
          255,
          255,
          0.08
        );

      border:
        1px solid
        rgba(
          255,
          255,
          255,
          0.15
        );

      box-shadow:
        0 20px 60px
        rgba(
          0,
          0,
          0,
          0.35
        );

    }


    /* =============================== */
    /* LOGO                            */
    /* =============================== */

    .logo {

      display: block;

      width: 100%;

      max-width: 500px;

      height: auto;

      margin:
        0 auto
        30px auto;

    }


    /* =============================== */
    /* TÍTULO                          */
    /* =============================== */

    h1 {

      margin-bottom: 15px;

      font-size: 34px;

      font-weight: 700;

      letter-spacing: 1px;

    }


    /* =============================== */
    /* DESCRIPCIÓN                     */
    /* =============================== */

    .descripcion {

      margin-bottom: 30px;

      font-size: 18px;

      line-height: 1.5;

      opacity: 0.9;

    }


    /* =============================== */
    /* BOTÓN                           */
    /* =============================== */

    .boton {

      display: inline-block;

      padding:
        15px 40px;

      border-radius: 50px;

      background: #ffffff;

      color: #07152c;

      text-decoration: none;

      font-size: 17px;

      font-weight: bold;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

    }


    .boton:hover {

      transform:
        translateY(-3px);

      box-shadow:
        0 10px 25px
        rgba(
          0,
          0,
          0,
          0.3
        );

    }


    /* =============================== */
    /* PIE                             */
    /* =============================== */

    .pie {

      margin-top: 30px;

      font-size: 13px;

      opacity: 0.6;

    }


    /* =============================== */
    /* MÓVILES                         */
    /* =============================== */

    @media
    (max-width: 600px) {

      .contenedor {

        padding: 15px;

      }

      .tarjeta {

        padding:
          30px 20px;

        border-radius:
          18px;

      }

      .logo {

        max-width:
          350px;

      }

      h1 {

        font-size:
          27px;

      }

      .descripcion {

        font-size:
          16px;

      }

      .boton {

        width: 100%;

        max-width:
          300px;

      }

    }

  </style>

</head>


<body>


  <main class="contenedor">


    <section class="tarjeta">


      <!-- LOGO -->

      <img
        src="https://1iliil.github.io/PREMIOS-ECUABET/Logo.png"
        alt="PREMIOS ECUABET"
        class="logo"
      >


      <!-- TÍTULO -->

      <h1>
        PREMIOS ECUABET
      </h1>


      <!-- DESCRIPCIÓN -->

      <p class="descripcion">

        Ingresa y conoce más información.

      </p>


      <!-- BOTÓN -->

      <a
        href="#"
        class="boton"
        onclick="return false;"
      >

        INGRESAR

      </a>


      <!-- PIE -->

      <div class="pie">

        PREMIOS ECUABET

      </div>


    </section>


  </main>


</body>

</html>

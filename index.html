  <!-- ========================================== -->
  <!-- ESTILOS                                    -->
  <!-- ========================================== -->

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      font-family: Arial, Helvetica, sans-serif;

      background:
        linear-gradient(
          135deg,
          #061326 0%,
          #0a2348 50%,
          #123b75 100%
        );

      color: #ffffff;
    }


    /* CONTENEDOR */

    .contenedor {
      width: 100%;
      max-width: 700px;

      text-align: center;
    }


    /* TARJETA */

    .tarjeta {
      width: 100%;

      padding: 45px 30px;

      border-radius: 25px;

      background:
        rgba(255, 255, 255, 0.08);

      border:
        1px solid
        rgba(255, 255, 255, 0.15);

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.35);
    }


    /* LOGO */

    .logo {
      display: block;

      width: 100%;
      max-width: 500px;

      height: auto;

      margin: 0 auto 30px auto;
    }


    /* TÍTULO */

    h1 {
      margin-bottom: 15px;

      font-size: 34px;

      font-weight: 700;

      letter-spacing: 1px;
    }


    /* DESCRIPCIÓN */

    .descripcion {
      margin-bottom: 30px;

      font-size: 18px;

      line-height: 1.5;

      opacity: 0.9;
    }


    /* ========================================== */
    /* BOTÓN INGRESAR                            */
    /* ========================================== */

    #btnIngresar {
      display: block;

      width: 100%;
      max-width: 320px;

      margin: 0 auto;

      padding: 17px 35px;

      border: none;
      outline: none;

      border-radius: 50px;

      background: #ffffff;

      color: #07152c;

      font-family: Arial, Helvetica, sans-serif;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      -webkit-appearance: none;
      appearance: none;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }


    #btnIngresar:hover {
      transform: translateY(-3px);

      box-shadow:
        0 10px 25px
        rgba(0, 0, 0, 0.30);
    }


    #btnIngresar:active {
      transform: scale(0.97);
    }


    /* MENSAJE */

    #mensaje {
      display: none;

      margin-top: 18px;

      font-size: 14px;

      opacity: 0.8;
    }


    /* PIE */

    .pie {
      margin-top: 30px;

      font-size: 13px;

      opacity: 0.6;
    }


    /* ========================================== */
    /* CELULARES                                 */
    /* ========================================== */

    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .tarjeta {
        padding: 30px 20px;

        border-radius: 18px;
      }

      .logo {
        max-width: 350px;
      }

      h1 {
        font-size: 27px;
      }

      .descripcion {
        font-size: 16px;
      }

      #btnIngresar {
        max-width: 300px;

        font-size: 17px;
      }

    }

  </style>

</head>


<body>


  <main class="contenedor">

    <section class="tarjeta">


      <!-- LOGO -->

      <img
        src="https://1iliil.github.io/PREMIOS-ECUABET/Logo.png"
        alt="PREMIOS ECUABET"
        class="logo"
      >


      <!-- TÍTULO -->

      <h1>
        PREMIOS ECUABET
      </h1>


      <!-- DESCRIPCIÓN -->

      <p class="descripcion">
        Ingresa y conoce más información.
      </p>


      <!-- ====================================== -->
      <!-- BOTÓN INGRESAR                        -->
      <!-- ====================================== -->

      <input
        type="button"
        id="btnIngresar"
        value="INGRESAR"
        onclick="irAlFormulario()"
      >


      <p id="mensaje">
        Ingresando...
      </p>


      <!-- PIE -->

      <div class="pie">
        PREMIOS ECUABET
      </div>


    </section>

  </main>


  <!-- ========================================== -->
  <!-- REDIRECCIÓN A GOOGLE APPS SCRIPT           -->
  <!-- ========================================== -->

  <script>

    function irAlFormulario() {

      const URL_DESTINO =
        "https://script.google.com/macros/s/AKfycbz3TTh2F972_mB3eWFd1zIRLxS3RizNmSn8JtvaEY_iWfvRCIxJO-NiwyIgJ1gPaV4/exec";

      const boton =
        document.getElementById("btnIngresar");

      const mensaje =
        document.getElementById("mensaje");


      /* Mostrar que se está ingresando */

      boton.value = "INGRESANDO...";

      mensaje.style.display = "block";


      /* REDIRECCIÓN */

      window.location.href = URL_DESTINO;

    }

  </script>


</body>

</html>
